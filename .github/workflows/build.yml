name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build TonightsBest.NINA.sln --configuration Release
      - run: dotnet test TonightsBest.NINA.sln --configuration Release --no-build
